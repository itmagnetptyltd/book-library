evidence: >-
  The reset-the-form half is ruled out by REQ-BOOK-006@v1 criterion 7,
  which requires that a typed value is still shown when the form is
  redisplayed without being submitted. The close-the-modal half is covered
  by no criterion, but a Cancel control that closes the modal is already
  delivered and working, so only the reset is chargeable. The premise that
  Cancel does nothing is incorrect - see FB-0001.

