  depends_on:
    - REQ-BOOK-005

- id: REQ-BOOK-007
  title: Submitting the Add Book form adds the new Book to the Library
  module: BOOK
  priority: must
  status: draft
  version: 2
  source: >-
    Client brief, ITMagnet - Test, email 2026-08-19 ("After submitting the form,
    the new book should be added to the library"); clarified by client answers
    in ANSWERS.md, recorded 2026-08-21
  acceptance:
    - given: The Add Book form is shown with details entered for a new Book
      when: The form is submitted
      then: The Library returns a Book carrying exactly those entered details
    - given: The Library holds two Books
      when: A third Book is submitted through the Add Book form
      then: The Library returns three Books
    - given: The Add Book form is submitted with Name, Author, Language and Price entered and no Book ID
      when: The Book is added
      then: The Library returns that Book carrying a Book ID the application issued
    - given: The Library already holds Books
      when: A further Book is added
      then: No two Books in the Library carry the same Book ID
    - given: A Book has been added and then deleted
      when: A further Book is added
      then: The further Book carries a Book ID different from the deleted Book's Book ID
    - given: The Add Book form is submitted with any one of Name, Author, Language or Price left empty
      when: The submission is refused
      then: No Book is added to the Library
    - given: A submission that the application refuses
      when: The Add Book form is submitted
      then: An error message naming what is wrong is shown in the Add Book form
    - given: A submission that the application refuses
      when: The Add Book form is submitted
      then: The values already entered are still shown in the form
    - given: A Book has been added
      when: The application is stopped and started again
      then: The Library still returns that Book
    - given: No person has signed in
      when: The Add Book form is submitted with all details entered
      then: The Book is added to the Library
    - given: A Book has been added
      when: Its Book card is shown in the Gallery
      then: No control for changing that Book's details is present
  ambiguities:
    - What is the largest Price a Book may carry?
  history:
    - version: 1
      agreed: 2026-08-21
      superseded_by: 2
      summary: >-
        v1 required that the Library return a Book carrying exactly the entered
        details, with no limit on Price. Superseded by CHG-0001: a Price whose
        poisha exceeds Number.MAX_SAFE_INTEGER cannot be stored exactly, and v1
        was silently violated for such values rather than refusing them.
  depends_on:
    - REQ-BOOK-006
    - REQ-BOOK-012

- id: REQ-BOOK-008
  title: A Book added through the form appears in the Gallery immediately after submission
  module: BOOK
  priority: must
