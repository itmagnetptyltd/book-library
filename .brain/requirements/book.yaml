# .brain/requirements/book.yaml
#
# Decomposition of the client brief for the Book Library project.
# Source: .brain/requirements/BRIEF.md — Client brief, ITMagnet - Test, email 2026-08-19.
# Clarified by: .brain/requirements/ANSWERS.md — client answers, recorded 2026-08-21,
# in two replies. All 25 questions raised at decomposition are now answered.
#
# Every requirement here is `agreed`. AMBIGUITIES.md holds no open question.
#
# Terms are used exactly as `.brain/glossary.md` fixes them: Book, Library,
# Book ID, Name, Author, Book card, Gallery, Home page, Add Book form.

- id: REQ-BOOK-001
  title: The Home page shows every Book in the Library as a Gallery of Book cards
  module: BOOK
  priority: must
  status: in_progress
  version: 1
  source: >-
    Client brief, ITMagnet - Test, email 2026-08-19 ("The home page should
    display all books in a clean and attractive gallery/grid layout"); clarified
    by client answers in ANSWERS.md, recorded 2026-08-21, first and second
    replies
  acceptance:
    - given: The Library holds three Books
      when: The Home page is opened
      then: The Gallery shows three Book cards
    - given: The Library holds a Book
      when: The Home page is opened
      then: A Book card for that Book is present in the Gallery
    - given: The Library holds Books
      when: The Home page is opened in a desktop browser on the local development PC
      then: The Gallery shows the Book cards laid out as a grid of more than one column
    - given: Two Books have been added, the second more recently than the first
      when: The Home page is opened
      then: The Book card for the more recently added Book appears before the Book card for the earlier one
    - given: The Library holds no Books
      when: The Home page is opened
      then: A message stating that there are no Books yet and inviting the first Book to be added is shown in place of the Book cards
    - given: The Library holds fifty Books
      when: The Home page is opened
      then: Fifty Book cards are shown, and no pagination control is present
    - given: The Home page is open in a second browser tab and a Book has been added in the first
      when: The second tab is reloaded
      then: The Gallery in the second tab shows a Book card for that Book
    - given: The Home page as delivered
      when: Its appearance is reviewed
      then: No brand, colour scheme, reference site or font is required to be matched, and a plain tidy layout satisfies the requirement
  ambiguities: []
  verified_by:
    - tests/server/home-page.test.js
  depends_on:
    - REQ-BOOK-012

- id: REQ-BOOK-002
  title: Each Book card shows that Book's Book ID, Name, Author, Language and Price
  module: BOOK
  priority: must
  status: agreed
  version: 1
  source: >-
    Client brief, ITMagnet - Test, email 2026-08-19 ("with each book card
    showing the Book ID, Name, Author, Language, and Price"); clarified by
    client answers in ANSWERS.md, recorded 2026-08-21, first and second replies
  acceptance:
    - given: A Book whose Book ID is known
      when: Its Book card is shown in the Gallery
      then: The card shows that Book ID
    - given: A Book whose Name is known
      when: Its Book card is shown in the Gallery
      then: The card shows that Name
    - given: A Book whose Author is known
      when: Its Book card is shown in the Gallery
      then: The card shows that Author
    - given: A Book whose Language is known
      when: Its Book card is shown in the Gallery
      then: The card shows that Language
    - given: A Book whose Price is known
      when: Its Book card is shown in the Gallery
      then: The card shows that Price
    - given: A Book added through the Add Book form, in which no Book ID was entered by the person
      when: Its Book card is shown in the Gallery
      then: The card shows a Book ID
    - given: A Book whose Language was entered as text not drawn from any predefined list
      when: Its Book card is shown in the Gallery
      then: The card shows that Language text unchanged
    - given: A Book whose Price is 350
      when: Its Book card is shown in the Gallery
      then: The card shows the Price with exactly two decimal places
    - given: Any Book in the Library
      when: Its Book card is shown in the Gallery
      then: The Price is shown in BDT, and no other currency appears on any card
  ambiguities: []
  depends_on:
    - REQ-BOOK-001

- id: REQ-BOOK-003
