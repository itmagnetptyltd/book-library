- id: REQ-BOOK-015
  title: The Add Book form presents a control for choosing a Cover Photo file
  module: BOOK
  priority: must
  status: draft
  version: 1
  source: >-
    Second brief, unattributed reviewer, 2026-08-21, Recommended Improvements
    item 1, Cover Photo Support ("Add an input[type="file"] in the Add Book
    form"), read with the Critical Missing Features row "Cover Photo Upload —
    No field or preview for book covers"
  acceptance:
    - given: The Add Book form is shown
      when: It is displayed
      then: It presents a file-choosing control for a Cover Photo
    - given: The Add Book form is shown
      when: A file is chosen through that control
      then: The name of the chosen file is shown in the Add Book form
    - given: The Add Book form is shown and a file has been chosen
      when: A different file is chosen through the same control
      then: The name of the newly chosen file is shown in place of the previous one
  ambiguities:
    - Is a Cover Photo part of a Book, or a separate thing the Library holds?
    - May a Book be added without a Cover Photo?
    - How many Cover Photos may one Book carry?
    - What is the largest Cover Photo file the application must accept?
    - Are the High, Medium and Low markings in the second brief the client's own priorities?
  depends_on:
    - REQ-BOOK-006

